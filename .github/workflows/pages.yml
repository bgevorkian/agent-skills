name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Validate Agent Skills
        run: uv run --python 3.13 scripts/validate_skills.py
      - name: Test database skills
        run: |
          uv run --python 3.13 --with clickhouse-connect python skills/clickhouse-readonly/tests/test_ch.py
          uv run --python 3.13 --with asyncpg python skills/postgres-readonly/tests/test_pg.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
